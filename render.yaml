# One-click deploy of the API to Render (https://render.com). Frontend deploys to Vercel.
services:
  - type: web
    name: resolvedesk-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci && npm run seed && npm run simulate
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22.13.0"
      # Production mode: the API refuses to start without JWT_SECRET and CORS_ORIGIN.
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      # Required. Comma-separated frontend origins, e.g. https://resolvedesk.example.com
      - key: CORS_ORIGIN
        sync: false
